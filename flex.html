<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-item{
            background-color:lightcoral;
            padding: 20px;
            margin:10px;
            width:200px;
            height: 150px;
            margin-top:10px;
            color:wheat;
            font-size:150;
            border:3px dashed black;
            border-radius: 20px;

        }
        .flex-container{
            display:flex;
            flex-wrap:wrap;
            flex-direction:row;
            /* space-evenly, space-between,space-around */
            justify-content:center;
            list-style-type:none;

            
        }
    </style>
</head>
<body>
       <!-- ul.flex-container>li.flex-item*10 -->
    <ul class="flex-container">
        <li class="flex-item">Item 1</li>
        <li class="flex-item">Item 2</li>
        <li class="flex-item">Item 3</li>
        <li class="flex-item">Item 4</li>
        <li class="flex-item">Item 5</li>
        <li class="flex-item">Item 6</li>
        <li class="flex-item">Item 7</li>
        <li class="flex-item">Item 8</li>
        <li class="flex-item">Item 9</li>
        <li class="flex-item">Item 10</li>
    </ul>
</body>
</html>

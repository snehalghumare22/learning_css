<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_transform_uppercase{
            text-transform: uppercase;
        }
        .t_transform_lowercase{
            text-transform: lowercase;
        }
        .t_transform_capitilize{
            text-transform: capitalize;
        }
        .t_decor_underling{
            text-decoration: underline;
        }
        .t_decor_overline{
            text-decoration: overline;
        }
        .t_decor_linethrough{
            text-decoration: line-through;
        }
        .t_decor_all{
            text-decoration: underline overline line-through;
        }
        .t_align_center{
            text-align:center;
    
        }
        .t_align_right{
            text-align:right;
        }
        .t_align_left{
            text-align:left
        }
        .t_shadow{
            text-shadow:5px 7px 4px red;
            font-size:90px;
            color:blue
        }

    </style>
</head>
<body>
    <h1 class="t_shadow t_align_center t_transform_uppercase">snehal</h1>
    <h1 class="t_align_center">hello pranita</h1>
    <h1 class="t_align_right">hello pranita</h1>
    <h1 class="t_align_left">hello pranita</h1>
    <h1 class="t_decor_all">snehal</h1>
    <h1 class="t_decor_underling"> hello aditi</h1>
    <h1 class="t_decor_overline"> hello aditi</h1>
    <h1 class="t_decor_linethrough"> hello aditi</h1>
    <h1 class="t_transform_uppercase" > this is the example for text formatting</h1>
    <h1 class="t_transform_lowercase" > this is the example for text formatting</h1>
    <h1 class="t_transform_capitilize" > this is the example for text formatting</h1
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_shadow{
            text-shadow: 5px 7px 8px red;
            color: blueviolet;
            font-size: 70px;
            text-align: center;
        }
        .b_shadow{
            width:200px;
            box-shadow:6px 7px 10px red;

        }
        .b_shadow2{
            width:400px;
            box-shadow:9px 10px 20px purple;
        }
        .d_shadow{
            width:300px;
            filter:drop-shadow( 5px 6px 10px red);
        }
    </style> 
</head>
<body>

    <h1 class="t_shadow">pratiksha</h1>

    <img src="images/bappa.jpeg"class="b_shadow"/>

    <img src="images/Ex9MlTC.jpg" class="b_shadow2"/>

    <img src="images/pngtree-orange-cat-cute-little-kitty-png-image_14519123.png" class="d_shadow"/>
    <img src="images/penguin-on-a-transparent-background-png.webp" class="d_shadow"/>
    
</body>
</html>

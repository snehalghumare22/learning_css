<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            background:linear-gradient(to right ,red,pink,orange,blue,purple);
        }
        .bg_heading{
            color:blue;
            text-align:center;
            padding:150px;
            font-size:80px;
            font-style:italic;
        }
        .linear2{
            background:linear-gradient( orange,white,green)
        }
        .radial{
            height:600px;
            /* ellipse */
            background:radial-gradient(circle, pink,red,purple,blue)
        }
        .conic{
            height:600px;
            /* ellipse */
            background:conic-gradient(from 90deg, rgb(21, 21, 33),rgb(255, 0, 221),purple,blue)
        }
        
        
    </style>
</head>
<body>
    <div class="conic"></div>
    <div class="radial"></div>
    <div class="linear">
        <h1 class="bg_heading">snehal</h1>
    </div>
    <div class="linear2">
        <h1 class="bg_heading">i love india</h1>
    </div>
</body>
</html>
</body>
</html>

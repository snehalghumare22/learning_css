<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:200px;
            height:150px;
            border:5px solid black;
            margin-bottom:10px;
            padding:20px;
            background-color:lightblue;
            font-style:italic;
        }
        .box1{
            position:static;
        }
        .box2{
            position:relative;
            top:30px;
            left:300px;
        }
        .box3{
            position:absolute;
            left:300px;
            top:20px;
        }
        .box4{
            position:sticky;
            top:10px;
        }
        .box5{
            position:fixed;
            bottom:0px;
        }

    </style>
</head>
<body>
    <!-- div.class*5 -->
    <div class="box box1">static</div>
    <div class="box box2">relative</div>
    <div class="box box3">absolute</div>
    <div class="box box4">sticky</div>
    <div class="box box5">fixed</div>
</body>
</html>
